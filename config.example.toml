# Copy to ~/.config/omarepos/config.toml and edit. Every key is optional.

# A root is a bare path, or a table when it needs options.
roots = [
  "~/code",

  # A "workspace": a repository that holds nothing but other clones. `nested`
  # finds the clones this folder's own repository ignores, at any depth, and
  # leaves its submodules out. `tag` is one word, put on what is found, so you
  # can filter it back out of the grid.
  # { path = "~/work/acme", nested = true, tag = "acme", include_self = false },
]

# Individual repositories outside the roots above.
extra_repos = []
max_depth = 3
# terminal = "alacritty"
# editor = "nvim"
follow_omarchy_theme = true

# Background refresh. Off until `every_minutes` is non-zero.
[refresh]
every_minutes = 0
fetch = false          # `git fetch`: network, but never your working tree
fast_forward = false   # update the code, clean fast-forwards only
only_tags = []         # blank means every repository
max_parallel = 4
timeout_seconds = 60
