[package]
name = "omarepos"
version = "0.1.0"
edition = "2024"
description = "Omarchy-styled overview of every git repo on your machine"
license = "MIT"
default-run = "omarepos"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
git2 = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
async-channel = "2"
# Syntax highlighting for the diff view. Pure Rust (no oniguruma), so the app
# keeps installing with nothing but a C toolchain, and bundles its own syntax
# definitions rather than depending on a system library being present.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
